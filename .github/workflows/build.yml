# StreamBridge CI:多平台构建 + 测试 + lint
# 触发:push 到 main/master、PR、手动
name: Build & Test

on:
  push:
    branches: [main, master]
    tags-ignore: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 1. 单元测试 + lint ----------
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - run: go mod download

      - run: go vet ./...

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

      - run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: coverage-${{ github.sha }}
          path: coverage.out
          retention-days: 7

  # ---------- 2. 多平台构建 ----------
  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            output: streambridge-linux-amd64
          - os: linux
            arch: arm64
            runner: ubuntu-latest
            output: streambridge-linux-arm64
          - os: darwin
            arch: amd64
            runner: macos-13
            output: streambridge-darwin-amd64
          - os: darwin
            arch: arm64
            runner: macos-latest
            output: streambridge-darwin-arm64
          - os: windows
            arch: amd64
            runner: windows-latest
            output: streambridge-windows-amd64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Download deps
        run: go mod download -x
        env:
          GOPROXY: https://proxy.golang.org,direct

      - name: Build (Unix)
        if: matrix.os != 'windows'
        run: |
          export GOOS=${{ matrix.os }}
          export GOARCH=${{ matrix.arch }}
          export CGO_ENABLED=0
          export GOPROXY=https://proxy.golang.org,direct
          go build -x -mod=mod -trimpath -o ${{ matrix.output }} ./cmd/streambridge

      - name: Build (Windows)
        if: matrix.os == 'windows'
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: go build -mod=mod -trimpath -o ${{ matrix.output }} ./cmd/streambridge

      - name: Smoke test (Unix)
        if: matrix.os != 'windows'
        run: |
          chmod +x ${{ matrix.output }}
          ./${{ matrix.output }} version || true

      - name: Smoke test (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: .\${{ matrix.output }} version
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}
          retention-days: 14

  # ---------- 3. Docker 镜像构建测试 ----------
  docker:
    name: Docker Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: streambridge:ci
          load: true

      - name: Smoke test
        run: |
          docker run --rm -d --name sb-ci -p 18080:8080 streambridge:ci
          sleep 3
          curl -fsS http://localhost:18080/api/health | grep -q '"status"'
          docker stop sb-ci
